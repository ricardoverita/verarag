packages:
  - apps/*
  - packages/*

# Dependencies may not run install scripts unless listed here.
allowBuilds:
  # Its postinstall only downloads a fallback binary when the prebuilt one is missing.
  unrs-resolver: false
  # Pulled in by testcontainers through dockerode. The native builds only speed
  # up SSH connections to remote Docker hosts, which the tests do not use.
  cpu-features: false
  ssh2: false
  # Its postinstall only checks the installed version.
  protobufjs: false
  # Usage analytics pulled in by swagger-ui-dist. Its postinstall only reports installs.
  '@scarf/scarf': false

peerDependencyRules:
  # eslint-config-next still pulls plugins that do not list ESLint 10 as a
  # peer. They work with it; remove these once the plugins catch up.
  allowedVersions:
    eslint-plugin-import>eslint: '10'
    eslint-plugin-jsx-a11y>eslint: '10'
    eslint-plugin-react>eslint: '10'
